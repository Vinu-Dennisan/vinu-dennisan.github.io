name: Deploy portfolio and Student Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve portfolio files for deployment
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C _site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/studentportal/package-lock.json

      - name: Install Student Portal dependencies
        working-directory: projects/studentportal
        run: npm ci

      - name: Build Student Portal
        working-directory: projects/studentportal
        run: npm run build

      - name: Add Student Portal build beside portfolio
        run: |
          mkdir -p _site/studentportal
          cp -a projects/studentportal/build/. _site/studentportal/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
