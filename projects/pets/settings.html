{% extends 'base.html' %}

{% block content %}
<style>
    p{
        width: 100%;
        max-width: 300px;
        justify-content: center;
        align-items: center;
        
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(92, 79, 79, 0.1);

    }
    h1{
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
</style>
<br><br>
<center>
<h1>User Profile</h1><br><br>
<div class="form-container">
<p>Name: {{ profile.name }}</p>
<p>Email: {{ profile.email }}</p>
<p>Address:{{ profile.address }}</p>
<p>Phone: {{ profile.phone }}</p>
<p>Gender: {{ profile.gender }}</p><br><br>
<a href="{% url 'settings_edit' %}" class="btn btn-primary">Edit Profile</a>
</div>
</center>

{% endblock %}
