{% extends 'base.html' %}

{% block content %}

<style>
    h1 {
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: blueviolet;
    }
    label {
        color: brown;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    .container {
        width: 100%;
        max-width: 300px;
        justify-content: center;
        align-items: center;   
        background-color: rgb(153, 217, 243);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(92, 79, 79, 0.1);
    }
    img {
        max-width: 100%;
        height: min-content;
        float: left;
    }
   
</style><br><br>
<h1>Login Page</h1>
<br><br>
<img src="https://img.freepik.com/premium-photo/vector-logo-pet-care-services-company_1247965-35069.jpg?w=740" width="400px" height="300px" alt="Sample Image" class="right-image">
<div class="container">
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="exampleInputEmail1">Username</label>
            <input name="username" type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Username">
        </div>
        <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input name="password" type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
        </div>
        <button type="submit" class="btn btn-info">Login</button>
    </form>
</div>
{% endblock %}
<footer>&copy; PET SHOP</footer>
