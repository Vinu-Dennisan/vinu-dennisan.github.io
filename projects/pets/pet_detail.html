{% extends 'vpets.html' %}

{% block content %}
<h4>Pet Name: {{ dog.dog_name }}</h4>
<p>Price: {{ dog.price }}</p>
<p>Pet Age: {{ dog.age }}</p>
<p>Pet Breed: {{ dog.breed }}</p>
<form action="{% url 'add_to_cart' %}" method="post">
    {% csrf_token %}
    <button type="submit">Add to Cart</button>
</form>
<!-- Buy pet form -->
<form action="{% url 'booking' %}" method="post">
{% csrf_token %}

<input type="submit" value="Buy Now">
</form>

</form>-->
{% endblock %}
